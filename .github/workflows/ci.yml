name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean test build :patches:buildAndroid
      - name: Verify Android RVP
        shell: pwsh
        run: |
          $rvp = Get-ChildItem patches/build/libs/patches-*.rvp | Where-Object Name -NotMatch 'sources|javadoc' | Select-Object -First 1
          ./scripts/verify-android-rvp.ps1 -Path $rvp.FullName
