name: Dependabot automation

on:
  schedule:
    - cron: "0 9 28 * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  dependabot:
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    uses: roflsunriz/myAGENTS/.github/workflows/dependabot-automation.yml@a0b3cb541342a67ac38845d2de31ccaf73ed75a6
    with:
      ci_workflows: '["CI"]'
      callback_workflow_file: dependabot-automation.yml
      autofix_command: 'export JAVA_HOME="$JAVA_HOME_21_X64"; export PATH="$JAVA_HOME/bin:$PATH"; ./gradlew --no-daemon build --write-locks'
      autofix_paths: '["extensions/googleapp/gradle.lockfile","patches/gradle.lockfile","settings-gradle.lockfile"]'
      autofix_workflow_files: '["ci.yml"]'
