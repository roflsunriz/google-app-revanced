name: Dependabot automation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  dependabot:
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    uses: roflsunriz/myAGENTS/.github/workflows/dependabot-automation.yml@8bcb79de73249f04e83d0a6071d30ac025710a17
    with:
      ci_workflows: '["CI"]'
      callback_workflow_file: dependabot-automation.yml
      autofix_command: 'export JAVA_HOME="$JAVA_HOME_21_X64"; export PATH="$JAVA_HOME/bin:$PATH"; ./gradlew --no-daemon build --write-locks'
      autofix_paths: '["extensions/googleapp/gradle.lockfile","patches/gradle.lockfile","settings-gradle.lockfile"]'
      autofix_workflow_files: '["ci.yml"]'
